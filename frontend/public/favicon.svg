<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Fadhili AI">
  <!--
    Fadhili AI mark: a signing hand, drawn to match the Logo component
    in src/components/common/Logo.tsx.

    This replaces a generic purple-gradient icon that was neither
    original to Fadhili nor consistent with the product's palette.
    Strokes are heavier than the in-app logo so the shape stays legible
    at 16px.

    Palette is the project's own: ink #14181A, paper #F2EFE7,
    ochre #C89B3C.
  -->
  <rect width="32" height="32" rx="8" fill="#14181A"/>
  <g fill="none" stroke="#F2EFE7" stroke-width="2.3" stroke-linecap="round">
    <path d="M11 19.5V11.2a1.6 1.6 0 0 1 3.2 0v5.2"/>
    <path d="M14.2 16.4V9.4a1.6 1.6 0 0 1 3.2 0v7"/>
  </g>
  <path
    d="M17.4 16.6v-4.4a1.55 1.55 0 0 1 3.1 0v8.1c0 3.1-2.3 5.4-5.4 5.4h-1c-1.9 0-3.2-.7-4.3-2.1l-2.9-3.8c-.6-.8-.4-1.9.5-2.4.8-.4 1.7-.2 2.3.4l1.7 1.7"
    fill="none"
    stroke="#C89B3C"
    stroke-width="2.3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
