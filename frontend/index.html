<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14181A" />

    <title>Fadhili AI — Kenyan Sign Language recognition and learning</title>
    <meta
      name="description"
      content="Fadhili AI reads Kenyan Sign Language from your camera and helps you learn it. Experimental research software with a small, verified vocabulary — not a replacement for a qualified interpreter."
    />

    <!--
      %VITE_SITE_URL% is substituted by Vite at build time from the
      environment, so the canonical and Open Graph URLs follow whichever
      domain the site is actually deployed to instead of hardcoding one.
    -->
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fadhili AI" />
    <meta
      property="og:title"
      content="Fadhili AI — Kenyan Sign Language recognition and learning"
    />
    <meta
      property="og:description"
      content="Reads Kenyan Sign Language from your camera and helps you learn it. Experimental, with a small verified vocabulary."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Fadhili AI — Sign. Speak. Connect. Kenyan Sign Language recognition and learning."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Fadhili AI — Kenyan Sign Language recognition and learning"
    />
    <meta
      name="twitter:description"
      content="Reads Kenyan Sign Language from your camera and helps you learn it. Experimental, with a small verified vocabulary."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
